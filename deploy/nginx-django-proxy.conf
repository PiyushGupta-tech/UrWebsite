# Fast path for crawlers — avoid Slow-4G timeouts on robots.txt during Lighthouse audits.
location = /robots.txt {
    alias /www/wwwroot/urbanrupeeHome/frontend/public/robots.txt;
    default_type text/plain;
    add_header Cache-Control "public, max-age=86400";
}

# Proxy all traffic to Gunicorn (SPA + API). ^~ beats regex static locations below.
location ^~ / {
    proxy_pass http://127.0.0.1:8005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
